<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/admin_layout}">

<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/admin/report.css">
</th:block>

<th:block layout:fragment="content">
  <h2 class="admin-title">신고 관리</h2>

  <p class="warn-msg" th:if="${searchMsg != null}" th:text="${searchMsg}"></p>

  <!-- 검색 조건: 선택한 값은 searchDTO로 다시 채움 -->
  <form class="search-form" action="/admin/report/list" method="get">
    <input type="hidden" name="urgent" value="true" th:if="${searchDTO.urgent}">   <!-- 긴급만 보는 중이면 조회해도 유지 -->
    <div class="search-row">
    <select name="status">
      <option value="">처리상태 전체</option>
      <option value="RECEIVED" th:selected="${searchDTO.status == 'RECEIVED'}">접수</option>
      <option value="PROCESSING" th:selected="${searchDTO.status == 'PROCESSING'}">처리중</option>
      <option value="DONE" th:selected="${searchDTO.status == 'DONE'}">완료</option>
    </select>

    <select name="typeNo">
      <option value="">유형 전체</option>
      <optgroup th:each="group : ${typeGroupList}" th:label="${group.groupName}">
        <option th:each="type : ${group.typeList}" th:value="${type.typeNo}" th:text="${type.typeName}"
          th:selected="${searchDTO.typeNo != null and searchDTO.typeNo == type.typeNo}"></option>
      </optgroup>
    </select>

    <input type="text" name="routeNo" class="route-filter" placeholder="노선번호" maxlength="20"
      th:value="${searchDTO.routeNo}">
    <input type="text" name="keyword" class="keyword-filter" placeholder="내용·신고자 이름" maxlength="50"
      th:value="${searchDTO.keyword}">
    </div>

    <div class="search-row">
    <input type="date" name="startDate" th:value="${searchDTO.startDate}">
    <span>~</span>
    <input type="date" name="endDate" th:value="${searchDTO.endDate}">

    <select name="sort">
      <option value="priority" th:selected="${searchDTO.sort == 'priority'}">우선순위순</option>
      <option value="new" th:selected="${searchDTO.sort == 'new'}">최신순</option>
      <option value="old" th:selected="${searchDTO.sort == 'old'}">오래된순</option>
    </select>
    <select name="displayDataCnt">
      <option value="10" th:selected="${searchDTO.displayDataCnt == 10}">10개씩</option>
      <option value="20" th:selected="${searchDTO.displayDataCnt == 20}">20개씩</option>
      <option value="50" th:selected="${searchDTO.displayDataCnt == 50}">50개씩</option>
    </select>

    <div class="search-actions">
      <button type="submit" class="btn-primary">조회</button>
      <a class="reset-btn" href="/admin/report/list">초기화</a>
    </div>
    </div>
  </form>

  <p class="total-cnt" th:text="|전체 ${pageDTO.totalCnt}건|"></p>
  <!-- 처리 우선순위: 미처리 신고를 어떤 순서로 처리하면 되는지 -->
  <p class="priority-summary">
    <strong th:text="|미처리 ${summary.openCnt}건|"></strong>
    <!-- 긴급 신고만 보는 필터: 문구는 늘 같고, 켜져 있으면 진한 색으로 채워 보임. 한 번 더 누르면 전체 목록으로 돌아감 -->
    <a th:if="${summary.urgentCnt > 0}" class="tag-urgent tag-link" th:classappend="${searchDTO.urgent} ? 'is-on'"
      th:href="${searchDTO.urgent} ? @{/admin/report/list} : @{/admin/report/list(urgent=true)}"
      th:title="${searchDTO.urgent} ? '전체 목록으로 돌아가기' : '긴급 신고만 보기'" th:attr="aria-pressed=${searchDTO.urgent}"
      th:text="|긴급 ${summary.urgentCnt}건|"></a>
    <span class="priority-formula" th:text="|우선순위 = ${formula} (안전 관련·14일 이상 방치는 맨 앞)|"></span>
  </p>

  <table class="admin-table list-table">
    <thead>
      <tr>
        <th>우선순위</th>
        <th>접수번호</th>
        <th>신고 유형</th>
        <th>노선</th>
        <th class="left">내용</th>
        <th>신고자</th>
        <th>처리상태</th>
        <th>접수일</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="r : ${reportList}" th:with="p=${priorityMap.get(r.reportNo)}"
        th:classappend="${p != null and p.urgent} ? 'row-urgent'">
        <td class="priority-cell">
          <!-- 순위 칩 / 긴급·장기 방치 태그 / 점수를 세 칸 고정 폭으로 두어 모든 행에서 같은 자리에 맞춤 (긴급·장기 방치가 아닌 신고는 "일반" 태그) -->
          <div class="priority-grid" th:if="${p != null}">
            <span class="rank-chip" th:text="${p.rank}"
              th:title="${#strings.listJoin(p.reasonList, ' · ')}"></span>
            <span class="priority-tag" th:classappend="${p.urgent} ? 'tag-urgent' : 'tag-normal'"
              th:text="${p.urgent} ? (${p.aged} ? '장기 방치' : '긴급') : '일반'"></span>
            <span class="score-text" th:text="|${#numbers.formatDecimal(p.score, 1, 1)}점|"></span>
          </div>
          <span th:if="${p == null}" class="score-text">-</span>
        </td>
        <td th:text="${r.reportNo}"></td>
        <td th:text="${r.typeName}"></td>
        <td><a class="route-chip" th:href="@{/admin/report/list(routeNo=${r.routeNo})}" th:title="|${r.routeNo}번 노선 신고만 보기|"
            th:text="${r.routeNo}"></a></td>
        <td class="left">
          <a th:href="@{/admin/report/{no}(no=${r.reportNo})}" title="처리 화면으로 이동"
            th:text="${#strings.abbreviate(r.content, 30)}"></a>
        </td>
        <td th:text="${r.reporterName}"></td>
        <td><span class="status-badge" th:classappend="${'status-' + r.status}" th:text="${r.statusName}"></span></td>
        <td th:text="${#temporals.format(r.regDate, 'yyyy-MM-dd')}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(reportList)}">
        <td colspan="8" class="empty-cell">조회된 신고가 없습니다.</td>
      </tr>
    </tbody>
  </table>

  <!-- 페이지 번호: 검색·정렬 조건을 유지한 채 page만 바꿈 -->
  <div class="paging">
    <a th:if="${pageDTO.prev}"
      th:href="@{/admin/report/list(page=${pageDTO.startPage - 1}, status=${searchDTO.status}, typeNo=${searchDTO.typeNo}, routeNo=${searchDTO.routeNo}, keyword=${searchDTO.keyword}, startDate=${searchDTO.startDate}, endDate=${searchDTO.endDate}, sort=${searchDTO.sort}, displayDataCnt=${searchDTO.displayDataCnt}, urgent=${searchDTO.urgent})}">이전</a>

    <th:block th:each="p : ${#numbers.sequence(pageDTO.startPage, pageDTO.endPage)}">
      <strong th:if="${p == pageDTO.page}" th:text="${p}"></strong>
      <a th:unless="${p == pageDTO.page}" th:text="${p}"
        th:href="@{/admin/report/list(page=${p}, status=${searchDTO.status}, typeNo=${searchDTO.typeNo}, routeNo=${searchDTO.routeNo}, keyword=${searchDTO.keyword}, startDate=${searchDTO.startDate}, endDate=${searchDTO.endDate}, sort=${searchDTO.sort}, displayDataCnt=${searchDTO.displayDataCnt}, urgent=${searchDTO.urgent})}"></a>
    </th:block>

    <a th:if="${pageDTO.next}"
      th:href="@{/admin/report/list(page=${pageDTO.endPage + 1}, status=${searchDTO.status}, typeNo=${searchDTO.typeNo}, routeNo=${searchDTO.routeNo}, keyword=${searchDTO.keyword}, startDate=${searchDTO.startDate}, endDate=${searchDTO.endDate}, sort=${searchDTO.sort}, displayDataCnt=${searchDTO.displayDataCnt}, urgent=${searchDTO.urgent})}">다음</a>
  </div>
</th:block>

</html>
