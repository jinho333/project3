<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/admin_layout}">

<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/admin/dashboard.css">
</th:block>

<th:block layout:fragment="content">
  <div class="dash">
    <!-- 왼쪽: 노선 목록 (4단계에서 작성) -->
    <aside class="dash-list">
      <h3>노선 목록</h3>
    </aside>

    <!-- 오른쪽: 위 지도, 아래 예측 데이터 (오른쪽 끝에 여백) -->
    <div class="dash-main">
      <section class="dash-map">
        <div id="map"></div>
        <p id="mapMessage" class="map-message" hidden></p>
      </section>

      <!-- 지도에서 노선을 클릭하면 혼잡 예측 차트가 표시될 자리 (5단계에서 작성) -->
      <section class="dash-forecast">
        <h3>예측 데이터</h3>
        <p class="forecast-empty">지도에서 노선을 클릭하면 혼잡 예측이 표시됩니다.</p>
      </section>
    </div>
  </div>
</th:block>

<th:block layout:fragment="content_js">
  <!-- 카카오맵 SDK: 키가 없으면 불러오지 않음 (키는 application.yaml 의 kakao.js.key) -->
  <script th:if="${kakaoJsKey != null and !kakaoJsKey.isBlank()}"
    th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoJsKey}&autoload=false|"></script>
  <script src="/js/pages/admin/dashboard_map.js"></script>
</th:block>

</html>
