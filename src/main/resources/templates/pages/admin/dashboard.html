<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/admin_layout}">

<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/admin/dashboard.css">
</th:block>

<th:block layout:fragment="content">
  <h2 class="admin-title">대시보드</h2>

  <!-- 상태별 건수 카드 -->
  <div class="stat-cards">
    <div class="stat-card">
      <div class="stat-label">전체 신고</div>
      <div class="stat-num" th:text="${totalCnt}"></div>
    </div>
    <div class="stat-card" th:each="s : ${statusStat}">
      <div class="stat-label" th:text="${s.label}"></div>
      <div class="stat-num" th:text="${s.cnt}"></div>
    </div>
  </div>

  <!-- 노선별 / 유형별 막대: 가장 큰 값을 100%로 두고 비율로 길이를 정함 -->
  <div class="stat-groups">
    <section class="stat-group">
      <h3>신고가 많은 노선 TOP 10</h3>
      <p class="stat-empty" th:if="${#lists.isEmpty(routeStat)}">데이터가 없습니다.</p>
      <div class="bar-row" th:each="s : ${routeStat}">
        <a class="bar-label" th:href="@{/admin/report/list(routeNo=${s.label})}" th:text="${s.label}"
          title="이 노선의 신고 보기"></a>
        <div class="bar-track"><div class="bar-fill" th:style="|width: ${s.cnt * 100 / routeMax}%|"></div></div>
        <span class="bar-cnt" th:text="|${s.cnt}건|"></span>
      </div>
    </section>

    <section class="stat-group">
      <h3>신고가 많은 유형 TOP 10</h3>
      <p class="stat-empty" th:if="${#lists.isEmpty(typeStat)}">데이터가 없습니다.</p>
      <div class="bar-row" th:each="s : ${typeStat}">
        <span class="bar-label" th:text="${s.label}"></span>
        <div class="bar-track"><div class="bar-fill" th:style="|width: ${s.cnt * 100 / typeMax}%|"></div></div>
        <span class="bar-cnt" th:text="|${s.cnt}건|"></span>
      </div>
    </section>
  </div>
</th:block>

</html>
