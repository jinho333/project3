<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/admin_layout}">

<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/admin/route.css">
</th:block>

<th:block layout:fragment="content">
  <div class="page-narrow">
  <h2 class="admin-title">노선 관리</h2>

  <!-- 등록·수정·삭제 결과는 redirect 후 한 번만 보임 (flash) -->
  <p class="info-msg" th:if="${successMsg != null}" th:text="${successMsg}"></p>
  <p class="warn-msg" th:if="${errorMsg != null}" th:text="${errorMsg}"></p>

  <!-- 노선 등록 -->
  <form class="route-add-form" method="post" action="/admin/route/add">
    <h3>노선 등록</h3>
    <input type="text" name="routeNo" placeholder="노선번호 (예: 134)" maxlength="20" required>
    <input type="text" name="routeName" class="name-input" placeholder="노선 이름 (예: 율리공영차고지 ↔ 꽃바위)" maxlength="100" required>
    <button type="submit" class="btn-primary">등록</button>
  </form>

  <!-- 예측 노선 동기화: 예측 서버가 예측할 수 있는 노선번호를 DB의 노선 표에 맞춤(없던 노선만 추가, 이름은 "이름 미등록"으로 들어감) -->
  <form class="forecast-sync-form" method="post" action="/admin/route/forecast-sync">
    <h3>예측 노선</h3>
    <p>예측 서버가 예측할 수 있는 노선번호를 노선 목록에 맞춥니다. 없던 노선만 "이름 미등록"으로 추가하고, 이미 있는 노선은 바꾸지 않습니다. 이름은 아래 목록에서 수정하세요.</p>
    <button type="submit">예측 노선 동기화</button>
  </form>

  <!-- 노선 이름 가져오기: 울산 BIS 의 노선 이름으로 "이름 미등록" 노선의 이름만 채움(이미 이름이 있는 노선은 그대로) -->
  <form class="forecast-sync-form" method="post" action="/admin/route/bis-names">
    <h3>노선 이름</h3>
    <p>울산 BIS의 노선 정보로 "이름 미등록"인 노선의 이름만 채웁니다. 방향 이름이 3개 이상이면 맨 앞과 맨 뒤만 씁니다.</p>
    <button type="submit">노선 이름 가져오기</button>
  </form>

  <!-- 목록 위 줄: 왼쪽은 전체 건수, 오른쪽은 그 목록을 거르는 검색 -->
  <div class="list-head">
    <p class="total-cnt" th:text="|전체 ${pageDTO.totalCnt}건|"></p>
    <form class="route-search-form" method="get" action="/admin/route">
      <input type="text" name="keyword" placeholder="노선번호 또는 이름" th:value="${keyword}" aria-label="노선 검색">
      <button type="submit" class="btn-primary">검색</button>
      <a class="reset-btn" href="/admin/route">초기화</a>
    </form>
  </div>

  <!-- 노선번호는 신고와 연결돼 있어 바꿀 수 없고, 이름만 수정 가능 -->
  <table class="admin-table list-table route-table">
    <thead>
      <tr>
        <th>노선번호</th>
        <th class="left">노선 이름 · 관리</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="route : ${routeList}">
        <td><span class="route-chip" th:text="${route.routeNo}"></span></td>
        <!-- 이름 수정과 삭제를 한 칸에 나란히: 한 줄이 하나의 단위로 읽힘 -->
        <td class="left">
          <div class="route-actions">
            <form class="edit-form" method="post" action="/admin/route/edit">
              <input type="hidden" name="routeNo" th:value="${route.routeNo}">
              <input type="hidden" name="page" th:value="${pageDTO.page}">
              <input type="hidden" name="keyword" th:value="${keyword}">
              <input type="text" name="routeName" class="name-input" maxlength="100" th:value="${route.routeName}">
              <button type="submit">이름 수정</button>
            </form>
            <form class="delete-form" method="post" action="/admin/route/delete">
              <input type="hidden" name="routeNo" th:value="${route.routeNo}">
              <input type="hidden" name="page" th:value="${pageDTO.page}">
              <input type="hidden" name="keyword" th:value="${keyword}">
              <button type="button" class="delete-btn btn-danger" th:data-route-no="${route.routeNo}">삭제</button>
            </form>
          </div>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(routeList)}">
        <td colspan="2" class="empty-cell">등록된 노선이 없습니다.</td>
      </tr>
    </tbody>
  </table>

  <!-- 페이지 번호: 검색어를 유지한 채 page만 바꿈 -->
  <div class="paging">
    <a th:if="${pageDTO.prev}" th:href="@{/admin/route(page=${pageDTO.startPage - 1}, keyword=${keyword})}">이전</a>

    <th:block th:each="p : ${#numbers.sequence(pageDTO.startPage, pageDTO.endPage)}">
      <strong th:if="${p == pageDTO.page}" th:text="${p}"></strong>
      <a th:unless="${p == pageDTO.page}" th:text="${p}" th:href="@{/admin/route(page=${p}, keyword=${keyword})}"></a>
    </th:block>

    <a th:if="${pageDTO.next}" th:href="@{/admin/route(page=${pageDTO.endPage + 1}, keyword=${keyword})}">다음</a>
  </div>
  </div>
</th:block>

<th:block layout:fragment="content_js">
  <script src="/js/pages/admin/route.js"></script>
</th:block>

</html>
