<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/user_layout}">

<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/report/report_done.css">
</th:block>

<th:block layout:fragment="content">
  <div class="done-wrap">
    <div class="done-check" aria-hidden="true">&#10003;</div>
    <h2 class="done-title">신고가 접수되었습니다</h2>
    <p class="done-sub">소중한 의견 감사합니다. 처리 결과는 신고 조회에서 확인할 수 있어요.</p>

    <dl class="done-box">
      <div><dt>신고번호</dt><dd class="done-no" th:text="${report.reportNo}"></dd></div>
      <div><dt>유형</dt><dd th:text="|${report.groupName} > ${report.typeName}|"></dd></div>
      <div><dt>노선</dt><dd th:text="${report.routeNo}"></dd></div>
      <div><dt>접수일</dt><dd th:text="${#temporals.format(report.regDate, 'yyyy-MM-dd HH:mm')}"></dd></div>
      <div><dt>처리상태</dt><dd><span class="badge" th:classappend="|badge-${report.status}|" th:text="${report.statusName}"></span></dd></div>
    </dl>

    <div class="done-btns">
      <a class="btn-primary" th:href="@{/report/{no}(no=${report.reportNo})}">접수 내용 보기</a>
      <a th:href="@{/report/list}">신고 조회</a>
      <a th:href="@{/}">메인으로</a>
    </div>
  </div>
</th:block>

</html>
