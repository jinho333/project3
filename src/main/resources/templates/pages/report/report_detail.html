<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/user_layout}">

<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/report/report_detail.css">
</th:block>

<th:block layout:fragment="content">
  <div class="detail-wrap">
    <h2 class="detail-title">신고 상세</h2>
    <p class="info-msg" th:if="${param.updated != null}">신고 내용이 수정되었습니다.</p>

    <table class="detail-table">
      <tr>
        <th>신고번호</th>
        <td th:text="${report.reportNo}"></td>
        <th>처리상태</th>
        <td><span class="badge" th:classappend="|badge-${report.status}|" th:text="${report.statusName}"></span></td>
      </tr>
      <tr>
        <th>신고자</th>
        <td th:text="${report.reporterName}"></td>
        <th>휴대전화번호</th>
        <td th:text="${report.reporterPhone}"></td>
      </tr>
      <tr>
        <th>유형</th>
        <td th:text="|${report.groupName} > ${report.typeName}|"></td>
        <th>노선</th>
        <td th:text="${report.routeNo}"></td>
      </tr>
      <tr>
        <th>접수일</th>
        <td colspan="3" th:text="${#temporals.format(report.regDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
      </tr>
      <tr>
        <th>내용</th>
        <!-- 줄바꿈이 그대로 보이도록 CSS(white-space: pre-wrap)로 처리 -->
        <td colspan="3" class="content-cell" th:text="${report.content}"></td>
      </tr>
      <tr>
        <th>처리 결과</th>
        <td colspan="3" class="content-cell">
          <span th:if="${report.answer != null}" th:text="${report.answer}"></span>
          <span class="no-answer" th:if="${report.answer == null}">아직 등록된 처리 결과가 없습니다.</span>
          <div class="answer-date" th:if="${report.answerDate != null}"
            th:text="|답변일 ${#temporals.format(report.answerDate, 'yyyy-MM-dd HH:mm')}|"></div>
        </td>
      </tr>
    </table>

    <!-- 첨부파일: 사진은 바로 보여주고, mp4는 재생, 그 외 동영상은 파일명 링크 -->
    <div class="file-area" th:if="${not #lists.isEmpty(report.fileList)}">
      <h3>첨부파일</h3>
      <div class="file-item" th:each="file : ${report.fileList}">
        <img th:if="${file.image}" th:src="@{/upload/{name}(name=${file.saveName})}" th:alt="${file.originName}">
        <video th:if="${file.mp4}" th:src="@{/upload/{name}(name=${file.saveName})}" controls></video>
        <a th:unless="${file.image or file.mp4}" th:href="@{/upload/{name}(name=${file.saveName})}"
          th:text="${file.originName}"></a>
        <p class="file-desc" th:text="${file.fileDesc}"></p>
      </div>
    </div>

    <div class="detail-btns">
      <a href="/report/list">목록으로</a>
      <!-- 아직 '접수' 상태일 때만 수정·취소 가능 -->
      <th:block th:if="${report.status == 'RECEIVED'}">
        <a class="btn-primary" th:href="@{/report/{no}/edit(no=${report.reportNo})}">수정</a>
        <form class="delete-form" id="deleteForm" method="post" th:action="@{/report/{no}/delete(no=${report.reportNo})}">
          <button type="button" id="deleteBtn">신고 취소</button>
        </form>
      </th:block>
    </div>
  </div>
</th:block>

<th:block layout:fragment="content_js">
  <script src="/js/pages/report/report_detail.js"></script>
</th:block>

</html>
