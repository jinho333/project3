<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/user_layout}">

<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/report/report_form.css">
</th:block>

<th:block layout:fragment="content">
  <div class="report-wrap">
    <h2 class="report-title">신고하기</h2>

    <form class="report-form" id="reportForm" action="/report" method="post" enctype="multipart/form-data">
      <!-- 서버 오류로 다시 열린 경우에는 입력했던 값(reportDTO)을, 처음에는 로그인 정보를 채움 -->
      <div class="form-row">
        <label class="form-label" for="reporterName">이름</label>
        <input type="text" id="reporterName" name="reporterName"
          th:value="${reportDTO?.reporterName ?: session.loginInfo.memberName}">
      </div>

      <div class="form-row">
        <label class="form-label" for="reporterPhone">휴대전화번호</label>
        <input type="text" id="reporterPhone" name="reporterPhone"
          th:value="${reportDTO?.reporterPhone ?: session.loginInfo.memberPhone}">
      </div>

      <div class="form-row">
        <span class="form-label">유형선택</span>
        <button type="button" class="select-btn" id="typeOpenBtn">유형선택하기</button>
        <span class="selected-text" id="selectedType"></span>
        <input type="hidden" id="typeNo" name="typeNo">
      </div>

      <div class="form-row">
        <span class="form-label">노선선택</span>
        <button type="button" class="select-btn">노선선택하기</button>
        <!-- 노선 목록(모달)을 만들기 전까지는 노선번호를 직접 입력 -->
        <input type="text" class="route-input" id="routeNo" name="routeNo"
          placeholder="노선번호 (예: 3600)" th:value="${reportDTO?.routeNo}">
      </div>

      <div class="form-row">
        <span class="form-label">사진선택</span>
        <div class="form-field">
          <ul class="notice-list">
            <li>첨부파일은 3개까지 가능하며(단, 동영상은 1개), 총 200MB이하로 첨부하여 주십시오.</li>
            <li>등록가능한 파일의 확장자명 : jpg, bmp, gif, avi, wmv, mpg, png, mov, mp4</li>
            <li>개인정보 및 부적절한 내용 등록시 비공개 처리 될 수 있습니다.</li>
          </ul>
          <div class="photo-list">
            <div class="photo-item">
              <label class="photo-box">
                <input type="file" name="files" hidden>
                <span class="photo-name"></span>
              </label>
              <input type="text" name="fileDescs" placeholder="첫번째 사진 설명 입력">
            </div>
            <div class="photo-item">
              <label class="photo-box">
                <input type="file" name="files" hidden>
                <span class="photo-name"></span>
              </label>
              <input type="text" name="fileDescs" placeholder="두번째 사진 설명 입력">
            </div>
            <div class="photo-item">
              <label class="photo-box">
                <input type="file" name="files" hidden>
                <span class="photo-name"></span>
              </label>
              <input type="text" name="fileDescs" placeholder="세번째 사진 설명 입력">
            </div>
          </div>
        </div>
      </div>

      <div class="form-row">
        <label class="form-label" for="content">내용입력</label>
        <textarea id="content" name="content" placeholder="불편신고 내용을 입력하세요."
          th:text="${reportDTO?.content}"></textarea>
      </div>

      <ul class="notice-list bottom-notice">
        <li>시민님의 말 한마디가 시민응대상담사를 아프게 할 수 있습니다.</li>
        <li>※ 폭언 등을 하지 말아주세요. 위반시 관련법에 의해 법적 조치 될 수 있습니다.</li>
      </ul>

      <!-- 오류 문구 (JS 검사 또는 서버 검사 실패 시) -->
      <p class="error-msg" id="reportMsg" th:text="${errorMsg}"></p>

      <div class="submit-area">
        <button type="button" class="submit-btn" id="submitBtn">보내기</button>
      </div>
    </form>
  </div>

  <!-- 유형선택 모달: 대분류와 유형은 DB(REPORT_TYPE_GROUP, REPORT_TYPE)에서 가져옴 -->
  <div class="modal" id="typeModal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h3>유형선택</h3>
        <button type="button" class="modal-close" id="typeCloseBtn">닫기</button>
      </div>
      <div class="modal-body">
        <section class="type-group" th:each="group : ${typeGroupList}">
          <h4 th:text="${group.groupName}"></h4>
          <div class="type-list">
            <button type="button" class="type-btn" th:each="type : ${group.typeList}"
              th:text="${type.typeName}" th:data-type-no="${type.typeNo}"></button>
          </div>
        </section>
      </div>
    </div>
  </div>
</th:block>

<th:block layout:fragment="content_js">
  <script src="/js/pages/report/report_form.js"></script>
</th:block>

</html>
