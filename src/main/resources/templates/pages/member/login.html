<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/user_layout}">

<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/member/login.css">
</th:block>

<th:block layout:fragment="content">
  <div class="login-wrap">
    <h2>로그인</h2>
    <form id="loginForm" action="/member/login" method="post">
      <div class="form-row">
        <label for="memberId">아이디</label>
        <input type="text" id="memberId" name="memberId">
      </div>
      <div class="form-row">
        <label for="memberPw">비밀번호</label>
        <input type="password" id="memberPw" name="memberPw">
      </div>
      <!-- 오류 문구 (JS 검사 또는 서버 로그인 실패 시) -->
      <p class="error-msg" id="errorMsg" th:text="${errorMsg}"></p>
      <button type="submit">로그인</button>
    </form>
    <a href="/member/join">회원가입</a>
  </div>
</th:block>

<th:block layout:fragment="content_js">
  <script src="/js/pages/member/login.js"></script>
</th:block>

</html>
