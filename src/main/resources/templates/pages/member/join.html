<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/user_layout}">

<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/member/join.css">
</th:block>

<th:block layout:fragment="content">
  <div class="join-wrap">
    <h2>회원가입</h2>
    <form id="joinForm" action="/member/join" method="post">
      <div class="form-row">
        <label for="memberId">아이디</label>
        <div class="id-line">
          <input type="text" id="memberId" name="memberId" placeholder="영문 소문자/숫자 4~20자">
          <button type="button" id="dupCheckBtn">중복확인</button>
        </div>
        <p class="error-msg" id="idMsg"></p>
      </div>

      <div class="form-row">
        <label for="memberPw">비밀번호</label>
        <input type="password" id="memberPw" name="memberPw" placeholder="영문+숫자 포함 8~20자">
        <p class="error-msg" id="pwMsg"></p>
      </div>

      <div class="form-row">
        <label for="memberPwCheck">비밀번호 확인</label>
        <input type="password" id="memberPwCheck">
        <p class="error-msg" id="pwCheckMsg"></p>
      </div>

      <div class="form-row">
        <label for="memberName">이름</label>
        <input type="text" id="memberName" name="memberName">
        <p class="error-msg" id="nameMsg"></p>
      </div>

      <div class="form-row">
        <label for="memberPhone">휴대전화번호</label>
        <input type="text" id="memberPhone" name="memberPhone" placeholder="숫자만 입력 (예: 01012345678)">
        <p class="error-msg" id="phoneMsg"></p>
      </div>

      <!-- 서버에서 보낸 오류 (아이디 중복 등) -->
      <p class="error-msg" th:text="${errorMsg}"></p>
      <button type="submit">가입하기</button>
    </form>
  </div>
</th:block>

<th:block layout:fragment="content_js">
  <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  <script src="/js/pages/member/join.js"></script>
</th:block>

</html>
