<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>버스 불편 신고</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/layouts/common.css">
  <link rel="stylesheet" href="/css/layouts/user_design.css">
  <!-- 페이지별 css -->
  <th:block layout:fragment="content_css"></th:block>
</head>
<body class="user">
  <!-- 헤더 -->
  <header class="header">
    <a class="logo" href="/">버스 불편 신고</a>
    <nav class="header-menu">
      <!-- 로그아웃 상태 -->
      <th:block th:if="${session.loginInfo == null}">
        <a class="nav-pill is-dark" href="/member/login">로그인</a>
        <a class="nav-pill" href="/member/join">회원가입</a>
      </th:block>
      <!-- 로그인 상태 -->
      <th:block th:unless="${session.loginInfo == null}">
        <a class="nav-pill" href="/admin" th:if="${session.loginInfo.role == 'ADMIN'}">관리자</a>
        <span th:text="|${session.loginInfo.memberName}님|"></span>
        <a class="nav-pill" href="/member/logout">로그아웃</a>
      </th:block>
    </nav>
  </header>

  <!-- 본문 -->
  <main class="content">
    <th:block layout:fragment="content"></th:block>
  </main>

  <!-- 푸터 -->
  <footer class="site-footer">
    <div class="site-footer-inner">
      <div>
        <div class="footer-logo">버스 불편 신고</div>
        <p>시민의 불편을 빠르게 전달하고, 처리 결과를 알려 드립니다.</p>
      </div>
      <nav>
        <a href="/report">신고 접수</a>
        <a href="/report/list">신고 조회</a>
      </nav>
    </div>
  </footer>

  <!-- 페이지별 js -->
  <th:block layout:fragment="content_js"></th:block>
</body>
</html>
